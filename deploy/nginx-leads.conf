# Nginx server block for the Lead Scanning Platform.
#
# Install:  sudo cp deploy/nginx-leads.conf /etc/nginx/sites-available/leads
#           sudo ln -s /etc/nginx/sites-available/leads /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
#
# Same shape as the PH-EBS block: Nginx serves the built React files directly
# and reverse-proxies the API. Because server_name is set, this block coexists
# with the existing site on one instance — requests are routed by Host header,
# so nothing about PH-EBS changes.

server {
    listen 80;
    listen [::]:80;

    # >>> CHANGE THIS to your actual subdomain, and point a DNS A record at the
    # instance's Elastic IP before running certbot.
    server_name leads.yourdomain.com;

    root /var/www/lead-scanning/dist;
    index index.html;

    access_log /var/log/nginx/leads-access.log;
    error_log  /var/log/nginx/leads-error.log;

    # Vite emits content-hashed bundles (index-CVDHnC8M.js), so assets can be
    # cached hard and index.html must not be — otherwise a deploy leaves users
    # on a stale HTML file that references bundles which no longer exist.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # API. The trailing slash on neither side is deliberate: the app already
    # serves everything under /api, so the prefix is passed through unchanged.
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Starting a scrape returns 202 immediately, but exports and a manual
        # digest to a member with thousands of matches are genuinely slow. The
        # 60s default surfaced as a 504 in the browser while the work actually
        # completed on the server, which is a confusing failure to diagnose.
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # Progress polling should not sit in a buffer waiting to be filled.
        proxy_buffering off;
    }

    # Single-page app: any unknown path is a client-side route, not a 404.
    # Without this, refreshing the browser on a deep link returns Nginx's 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The approval links in digest emails point at /api/approve/<token>; those
    # tokens are long, so keep header limits comfortable.
    large_client_header_buffers 4 16k;

    client_max_body_size 8m;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
