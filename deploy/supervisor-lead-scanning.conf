; Supervisor program for the Lead Scanning Platform API.
;
; Install:  sudo cp deploy/supervisor-lead-scanning.conf \
;                   /etc/supervisor/conf.d/lead-scanning.conf
;           sudo supervisorctl reread && sudo supervisorctl update
;
; The program name is deliberately distinct from ebs-api-backend so the two
; applications can be started, stopped and restarted independently on the same
; box — `sudo supervisorctl restart lead-scanning-api` must never touch PH-EBS.

[program:lead-scanning-api]
directory=/home/ubuntu/Deployment/lead-scanning/backend
; Kept on one line on purpose. Supervisor's INI parser joins wrapped values with
; newlines, and while shlex usually tolerates that, a broken command line here
; fails at deploy time with an unhelpful message.
command=/home/ubuntu/Deployment/lead-scanning/backend/.venv/bin/gunicorn --config /home/ubuntu/Deployment/lead-scanning/deploy/gunicorn.conf.py app.main:app
user=ubuntu

autostart=true
autorestart=true
startsecs=10
startretries=3

; Playwright launches Chromium as child processes. Without these two, a stop or
; restart leaves orphaned browsers behind that hold memory and file locks on the
; scraper's persistent profile — after a few restarts the instance runs out of
; RAM and the next scrape fails to launch a browser at all.
stopasgroup=true
killasgroup=true
stopwaitsecs=30

; HOME must be set explicitly: Supervisor does not inherit the login shell's
; environment, and Playwright resolves its browser cache relative to HOME. Left
; unset, the app starts fine and then fails only when a JS-rendered source is
; scraped — the worst kind of deferred failure.
environment=HOME="/home/ubuntu",PATH="/home/ubuntu/Deployment/lead-scanning/backend/.venv/bin:/usr/local/bin:/usr/bin:/bin",PLAYWRIGHT_BROWSERS_PATH="/home/ubuntu/.cache/ms-playwright",PYTHONUNBUFFERED="1"

stdout_logfile=/home/ubuntu/Deployment/lead-scanning/logs/supervisor-out.log
stderr_logfile=/home/ubuntu/Deployment/lead-scanning/logs/supervisor-err.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
