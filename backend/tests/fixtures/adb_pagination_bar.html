<!--
Lifted verbatim from logs/adb_no_results.html, a real ADB tenders page captured
on the user's machine. Kept because every guess this scraper made about the
pagination markup was wrong in a way that would have shipped:

  * there are no numbered page buttons at all — only Previous and Next;
  * the Next label is "Next >", not "Next", so an exact-match on "Next" finds
    nothing;
  * "disabled" is a CLASS plus an inline pointer-events:none, not the disabled
    attribute and not aria-disabled, so the usual checks all read it as live.

The first block below is page 1 (Previous disabled, Next live). The second is
the same bar as it appears on the last page, with the roles reversed — that one
is hand-derived from the first by swapping which anchor carries the disabled
class, because the capture only covers page 1.
-->
